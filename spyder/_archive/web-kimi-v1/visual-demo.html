<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spyder — Visual Direction Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0806;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    svg {
      width: 100%; height: 100%;
      max-width: 1600px;
    }
    #overlay-title {
      position: absolute;
      bottom: 48px; left: 48px;
      color: #f0e6d8;
      z-index: 10;
      pointer-events: none;
    }
    #overlay-title h1 {
      font-size: clamp(48px, 6vw, 96px);
      font-weight: 900;
      letter-spacing: -0.04em;
      text-shadow: 0 4px 30px rgba(0,0,0,0.8), 0 0 60px rgba(255,204,128,0.15);
      line-height: 0.95;
    }
    #overlay-title p {
      font-size: 16px;
      color: #a89b8a;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Wall texture gradient -->
        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2e2822"/>
          <stop offset="0.6" stop-color="#1f1a15"/>
          <stop offset="1" stop-color="#15110d"/>
        </linearGradient>

        <!-- Floor gradient -->
        <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3d3228"/>
          <stop offset="1" stop-color="#241d17"/>
        </linearGradient>

        <!-- Window night sky -->
        <radialGradient id="skyGrad" cx="0.5" cy="0.3" r="0.8">
          <stop offset="0" stop-color="#4a5a6e"/>
          <stop offset="0.5" stop-color="#252d38"/>
          <stop offset="1" stop-color="#11151c"/>
        </radialGradient>

        <!-- Lamp warm glow -->
        <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ffcc80" stop-opacity="0.28"/>
          <stop offset="0.5" stop-color="#ffcc80" stop-opacity="0.08"/>
          <stop offset="1" stop-color="#ffcc80" stop-opacity="0"/>
        </radialGradient>

        <!-- Window moonlight beam -->
        <linearGradient id="moonBeam" x1="0.5" y1="0" x2="0.6" y2="1">
          <stop offset="0" stop-color="#a8c4e0" stop-opacity="0.18"/>
          <stop offset="1" stop-color="#a8c4e0" stop-opacity="0"/>
        </linearGradient>

        <!-- Dust motes -->
        <radialGradient id="dustGrad" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>

        <!-- Spider body -->
        <radialGradient id="spiderBody" cx="0.4" cy="0.35" r="0.7">
          <stop offset="0" stop-color="#6a5a4a"/>
          <stop offset="0.6" stop-color="#3d3228"/>
          <stop offset="1" stop-color="#1f1913"/>
        </radialGradient>

        <!-- Character suit -->
        <linearGradient id="suitGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff9a3c"/>
          <stop offset="1" stop-color="#d46a1a"/>
        </linearGradient>

        <filter id="softGlow">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="heavyBlur">
          <feGaussianBlur stdDeviation="8"/>
        </filter>

        <filter id="noiseFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.12"/>
          </feComponentTransfer>
        </filter>

        <filter id="shadowBlur">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>

      <!-- Room shell -->
      <rect x="0" y="0" width="1600" height="650" fill="url(#wallGrad)"/>
      <rect x="0" y="650" width="1600" height="250" fill="url(#floorGrad)"/>
      <line x1="0" y1="650" x2="1600" y2="650" stroke="#0d0a08" stroke-width="3"/>

      <!-- Baseboards -->
      <rect x="0" y="620" width="1600" height="30" fill="#181411"/>
      <line x1="0" y1="620" x2="1600" y2="620" stroke="#0f0c09" stroke-width="2"/>

      <!-- Ceiling shadow gradient -->
      <rect x="0" y="0" width="1600" height="200" fill="url(#wallGrad)" opacity="0.5"/>

      <!-- Window on left -->
      <g transform="translate(180, 120)">
        <rect x="-16" y="-16" width="432" height="332" fill="#0d0a08"/>
        <rect x="0" y="0" width="400" height="300" fill="url(#skyGrad)"/>
        <!-- Moon -->
        <circle cx="320" cy="60" r="28" fill="#d4dfec" opacity="0.8" filter="url(#softGlow)"/>
        <circle cx="320" cy="60" r="42" fill="#d4dfec" opacity="0.15"/>
        <!-- Window frame -->
        <rect x="0" y="0" width="400" height="300" fill="none" stroke="#15120f" stroke-width="14"/>
        <line x1="200" y1="0" x2="200" y2="300" stroke="#15120f" stroke-width="10"/>
        <line x1="0" y1="150" x2="400" y2="150" stroke="#15120f" stroke-width="10"/>
        <!-- Moonlight beam -->
        <path d="M40,300 L120,0 L280,0 L360,300 Z" fill="url(#moonBeam)"/>
        <!-- Cracked pane -->
        <path d="M280,80 L300,140 L290,180" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
      </g>

      <!-- Wall detail: peeling wallpaper patches -->
      <g opacity="0.15" fill="#4a3f34">
        <path d="M500,200 Q520,220 540,210 T580,230 V280 H500 Z"/>
        <path d="M1100,350 Q1130,370 1150,360 T1200,380 V420 H1100 Z"/>
        <path d="M900,100 Q920,130 950,115 T1000,140 V190 H900 Z"/>
      </g>

      <!-- Picture frame -->
      <g transform="translate(680, 160)">
        <rect x="0" y="0" width="160" height="200" fill="#1a1410" stroke="#2a2019" stroke-width="6"/>
        <rect x="12" y="12" width="136" height="176" fill="#2e2620"/>
        <path d="M40,160 L60,100 L90,130 L120,70 L130,160 Z" fill="#3a3228"/>
        <circle cx="100" cy="60" r="14" fill="#4a4030" opacity="0.6"/>
      </g>

      <!-- Sofa -->
      <g transform="translate(140, 520)">
        <!-- Shadow -->
        <ellipse cx="220" cy="145" rx="230" ry="35" fill="#000" opacity="0.35" filter="url(#shadowBlur)"/>
        <!-- Back -->
        <path d="M40,0 H400 C420,0 430,20 430,60 V120 H10 V60 C10,20 20,0 40,0 Z" fill="#4a3b2e"/>
        <path d="M40,0 H400 C420,0 430,20 430,60 V120 H10 V60 C10,20 20,0 40,0 Z" fill="url(#wallGrad)" opacity="0.25"/>
        <!-- Seat -->
        <path d="M10,100 H430 V150 C430,170 420,180 400,180 H40 C20,180 10,170 10,150 Z" fill="#524232"/>
        <!-- Armrests -->
        <path d="M-10,60 H40 V150 C40,170 30,180 10,180 H-10 C-25,180 -35,170 -35,150 V90 C-35,70 -25,60 -10,60 Z" fill="#3e3226"/>
        <path d="M400,60 H450 C465,60 475,70 475,90 V150 C475,170 465,180 450,180 H400 V60 Z" fill="#3e3226"/>
        <!-- Cushion creases -->
        <path d="M140,105 V170 M290,105 V170" stroke="#2e231a" stroke-width="2" opacity="0.4"/>
        <!-- Torn fabric -->
        <path d="M180,40 Q190,55 200,45 T220,50" fill="none" stroke="#1a120d" stroke-width="2" opacity="0.5"/>
        <!-- Legs -->
        <rect x="10" y="180" width="20" height="25" fill="#2a211a"/>
        <rect x="410" y="180" width="20" height="25" fill="#2a211a"/>
      </g>

      <!-- Rug -->
      <ellipse cx="420" cy="760" rx="320" ry="70" fill="#3e3226" opacity="0.6"/>
      <ellipse cx="420" cy="760" rx="280" ry="55" fill="none" stroke="#524232" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

      <!-- Floor lamp -->
      <g transform="translate(1180, 180)">
        <!-- Stand -->
        <rect x="-4" y="0" width="8" height="470" fill="#2a211a"/>
        <ellipse cx="0" cy="470" rx="45" ry="12" fill="#1f1913"/>
        <!-- Shade -->
        <path d="M-55,0 H55 L40,90 H-40 Z" fill="#3d3228"/>
        <path d="M-55,0 H55 L40,90 H-40 Z" fill="url(#wallGrad)" opacity="0.3"/>
        <!-- Bulb glow -->
        <ellipse cx="0" cy="55" rx="25" ry="10" fill="#ffcc80" opacity="0.4" filter="url(#softGlow)"/>
        <!-- Light pool on floor -->
        <ellipse cx="0" cy="470" rx="180" ry="50" fill="url(#lampGlow)"/>
        <!-- Light cone -->
        <path d="M-40,90 L-180,470 H180 L40,90 Z" fill="url(#lampGlow)" opacity="0.5"/>
      </g>

      <!-- Bookshelf -->
      <g transform="translate(1300, 200)">
        <rect x="0" y="0" width="200" height="450" fill="#2a211a"/>
        <rect x="10" y="10" width="180" height="100" fill="#1a1410"/>
        <rect x="10" y="120" width="180" height="100" fill="#1a1410"/>
        <rect x="10" y="230" width="180" height="100" fill="#1a1410"/>
        <rect x="10" y="340" width="180" height="100" fill="#1a1410"/>
        <!-- Books -->
        <rect x="20" y="45" width="22" height="65" fill="#5c4033"/>
        <rect x="46" y="35" width="18" height="75" fill="#4a5c33"/>
        <rect x="68" y="50" width="28" height="60" fill="#335c4a"/>
        <rect x="100" y="40" width="16" height="70" fill="#5c4a33"/>
        <rect x="120" y="55" width="24" height="55" fill="#3d5c33"/>
        <rect x="148" y="30" width="20" height="80" fill="#5c3333"/>
        <!-- Leaning book -->
        <rect x="168" y="42" width="16" height="68" fill="#4a4a5c" transform="rotate(12 176 76)"/>
        <!-- Spider web on shelf -->
        <path d="M190,10 Q170,50 190,90" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      </g>

      <!-- Cobwebs in corners -->
      <g stroke="#ffffff" stroke-opacity="0.12" fill="none" stroke-width="1.2">
        <path d="M0,0 C60,30 110,20 160,0 M0,0 C30,60 20,110 0,160 M0,0 C80,40 140,80 180,20"/>
        <path d="M1600,0 C1540,40 1480,30 1430,0 M1600,0 C1570,70 1580,130 1600,180"/>
        <path d="M0,650 C50,620 100,630 140,650 M1600,650 C1550,620 1500,630 1460,650"/>
      </g>

      <!-- Hanging string spider thread -->
      <line x1="980" y1="0" x2="980" y2="220" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

      <!-- String Spider hanging -->
      <g id="stringSpider" transform="translate(980, 220)">
        <!-- Legs hanging down -->
        <g stroke="#5a4a3a" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M-8,8 Q-22,18 -26,35" class="leg"/>
          <path d="M-4,10 Q-18,28 -18,48" class="leg"/>
          <path d="M0,12 Q0,32 0,52" class="leg"/>
          <path d="M4,10 Q18,28 18,48" class="leg"/>
          <path d="M8,8 Q22,18 26,35" class="leg"/>
          <!-- Front legs raised near head -->
          <path d="M-6,-6 Q-20,-16 -24,-32" class="leg"/>
          <path d="M6,-6 Q20,-16 24,-32" class="leg"/>
        </g>
        <!-- Cephalothorax -->
        <ellipse cx="0" cy="-8" rx="9" ry="7" fill="url(#spiderBody)"/>
        <!-- Abdomen -->
        <ellipse cx="0" cy="10" rx="11" ry="16" fill="url(#spiderBody)"/>
        <!-- Markings -->
        <path d="M-5,6 Q0,14 5,6" fill="none" stroke="#8a7a6a" stroke-width="1.5" opacity="0.5"/>
        <ellipse cx="0" cy="18" rx="4" ry="6" fill="#2a211a" opacity="0.5"/>
        <!-- Eyes -->
        <g fill="#ffcc80" filter="url(#softGlow)">
          <circle cx="-3" cy="-10" r="1.5"/>
          <circle cx="3" cy="-10" r="1.5"/>
          <circle cx="-5" cy="-8" r="1"/>
          <circle cx="5" cy="-8" r="1"/>
        </g>
      </g>

      <!-- Wall Crawler on right wall -->
      <g id="wallSpider" transform="translate(1480, 320) rotate(-90)">
        <g stroke="#4a3a2a" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M-10,0 Q-24,-6 -30,-20" class="leg"/>
          <path d="M-8,5 Q-22,12 -26,28" class="leg"/>
          <path d="M-6,10 Q-16,24 -18,40" class="leg"/>
          <path d="M-3,12 Q-8,28 -8,44" class="leg"/>
          <path d="M10,0 Q24,-6 30,-20" class="leg"/>
          <path d="M8,5 Q22,12 26,28" class="leg"/>
          <path d="M6,10 Q16,24 18,40" class="leg"/>
          <path d="M3,12 Q8,28 8,44" class="leg"/>
        </g>
        <ellipse cx="0" cy="-7" rx="8" ry="6" fill="url(#spiderBody)"/>
        <ellipse cx="0" cy="9" rx="12" ry="15" fill="url(#spiderBody)"/>
        <path d="M-6,5 Q0,12 6,5" fill="none" stroke="#7a6a5a" stroke-width="1.5" opacity="0.4"/>
        <g fill="#ffcc80" filter="url(#softGlow)">
          <circle cx="-3" cy="-9" r="1.6"/>
          <circle cx="3" cy="-9" r="1.6"/>
        </g>
      </g>

      <!-- The Exterminator character -->
      <g id="exterminator" transform="translate(700, 620)">
        <!-- Shadow -->
        <ellipse cx="0" cy="165" rx="70" ry="14" fill="#000" opacity="0.4" filter="url(#shadowBlur)"/>

        <!-- Back leg -->
        <path d="M18,80 L22,160 L36,160" fill="none" stroke="#2d3a42" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Body / jumpsuit -->
        <path d="M-28,-60 H28 C38,-60 44,-50 44,-30 V90 C44,110 36,120 28,120 H-28 C-36,120 -44,110 -44,90 V-30 C-44,-50 -38,-60 -28,-60 Z" fill="url(#suitGrad)"/>
        <!-- Suit highlight -->
        <path d="M-20,-55 H-8 V110 H-20 Z" fill="#ffaa5c" opacity="0.4"/>
        <!-- Zipper line -->
        <line x1="0" y1="-55" x2="0" y2="110" stroke="#b85c1a" stroke-width="2" opacity="0.6"/>
        <!-- Pocket -->
        <rect x="18" y="-10" width="16" height="20" rx="2" fill="#d46a1a" stroke="#b85c1a" stroke-width="1"/>

        <!-- Front leg -->
        <path d="M-18,80 L-22,160 L-36,160" fill="none" stroke="#3d4a52" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Boots -->
        <path d="M-42,155 H-22 V175 H-42 C-50,175 -52,170 -52,165 C-52,158 -48,155 -42,155 Z" fill="#1f1913"/>
        <path d="M22,155 H42 C48,155 52,158 52,165 C52,170 50,175 42,175 H22 V155 Z" fill="#1f1913"/>

        <!-- Arms -->
        <path d="M-40,-40 L-62,20" fill="none" stroke="#ff9a3c" stroke-width="16" stroke-linecap="round"/>
        <circle cx="-62" cy="20" r="10" fill="#f0c8a0"/>

        <!-- Gun arm -->
        <path d="M40,-40 L70,-10" fill="none" stroke="#ff9a3c" stroke-width="16" stroke-linecap="round"/>
        <circle cx="70" cy="-10" r="10" fill="#f0c8a0"/>

        <!-- Vacuum gun -->
        <g transform="translate(70, -10) rotate(-15)">
          <rect x="0" y="-10" width="70" height="20" rx="4" fill="#5a6a72"/>
          <rect x="60" y="-14" width="20" height="28" rx="3" fill="#7a8b94"/>
          <rect x="-8" y="-6" width="16" height="12" rx="2" fill="#3d4a52"/>
          <!-- Hose to backpack -->
          <path d="M-8,0 C-30,-10 -50,10 -60,-50" fill="none" stroke="#2a211a" stroke-width="8" stroke-linecap="round"/>
        </g>

        <!-- Backpack -->
        <rect x="-55" y="-55" width="20" height="90" rx="5" fill="#3d3228"/>
        <rect x="-52" y="-50" width="14" height="30" rx="2" fill="#5c4a3d"/>
        <circle cx="-45" cy="-15" r="5" fill="#7a6a5a"/>

        <!-- Head / hood -->
        <circle cx="0" cy="-75" r="26" fill="#ff8c42"/>
        <circle cx="0" cy="-75" r="22" fill="#f0c8a0"/>
        <!-- Face shadow from hood -->
        <path d="M-22,-85 Q0,-65 22,-85 V-60 Q0,-45 -22,-60 Z" fill="#2a211a" opacity="0.25"/>
        <!-- Goggles -->
        <rect x="-16" y="-82" width="32" height="14" rx="4" fill="#1a120d"/>
        <circle cx="-7" cy="-75" r="5" fill="#4a7a8c"/>
        <circle cx="7" cy="-75" r="5" fill="#4a7a8c"/>
        <circle cx="-7" cy="-75" r="1.5" fill="#ffffff" opacity="0.8"/>
        <circle cx="7" cy="-75" r="1.5" fill="#ffffff" opacity="0.8"/>
        <!-- Hood rim -->
        <ellipse cx="0" cy="-78" rx="28" ry="10" fill="none" stroke="#ff8c42" stroke-width="5"/>
      </g>

      <!-- Foreground atmosphere -->
      <!-- Dust motes (static placeholders, animated via JS) -->
      <g id="dustLayer"></g>

      <!-- Vignette overlay -->
      <rect x="0" y="0" width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
      <defs>
        <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
          <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
        </radialGradient>
      </defs>

      <!-- Film grain overlay -->
      <rect x="0" y="0" width="1600" height="900" filter="url(#noiseFilter)" opacity="0.35" pointer-events="none"/>
    </svg>

    <div id="overlay-title">
      <h1>SPYDER</h1>
      <p>Visual Direction Demo · Living Room</p>
    </div>
  </div>

  <script>
    // Ambient dust particles
    const dustLayer = document.getElementById('dustLayer');
    const count = 60;
    const motes = [];

    for (let i = 0; i < count; i++) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      const x = Math.random() * 1600;
      const y = Math.random() * 900;
      const r = 0.5 + Math.random() * 2;
      c.setAttribute('cx', x);
      c.setAttribute('cy', y);
      c.setAttribute('r', r);
      c.setAttribute('fill', '#fff');
      c.setAttribute('opacity', 0.05 + Math.random() * 0.25);
      dustLayer.appendChild(c);
      motes.push({ el: c, x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 4 - 2, baseOp: parseFloat(c.getAttribute('opacity')) });
    }

    const stringSpider = document.getElementById('stringSpider');
    const wallSpider = document.getElementById('wallSpider');
    let t = 0;

    function animate(now) {
      const dt = 0.016;
      t += dt;

      // Dust drift
      for (const m of motes) {
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        if (m.x < 0) m.x = 1600;
        if (m.x > 1600) m.x = 0;
        if (m.y < 0) m.y = 900;
        if (m.y > 900) m.y = 0;
        m.el.setAttribute('cx', m.x);
        m.el.setAttribute('cy', m.y);
        const flicker = 0.7 + Math.sin(t * 2 + m.x) * 0.3;
        m.el.setAttribute('opacity', m.baseOp * flicker);
      }

      // Subtle spider idle motion
      const sway = Math.sin(t * 1.2) * 4;
      stringSpider.setAttribute('transform', `translate(${980 + sway}, 220) rotate(${sway * 0.3})`);

      const wallBob = Math.sin(t * 0.8) * 2;
      wallSpider.setAttribute('transform', `translate(1480, ${320 + wallBob}) rotate(-90)`);

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
