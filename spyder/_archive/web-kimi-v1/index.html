<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spyder — Living Room Prototype</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <svg id="room-bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#2a2520"/>
          <stop offset="100%" stop-color="#1a1612"/>
        </linearGradient>
        <linearGradient id="floorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3d3228"/>
          <stop offset="100%" stop-color="#2a211a"/>
        </linearGradient>
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffcc80" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#ffcc80" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="windowLight" cx="50%" cy="0%" r="80%">
          <stop offset="0%" stop-color="#a8c4e0" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#a8c4e0" stop-opacity="0"/>
        </radialGradient>
        <filter id="blurSoft">
          <feGaussianBlur stdDeviation="2"/>
        </filter>
      </defs>

      <!-- Walls & floor -->
      <rect x="0" y="0" width="1200" height="600" fill="url(#wallGradient)"/>
      <rect x="0" y="600" width="1200" height="200" fill="url(#floorGradient)"/>
      <line x1="0" y1="600" x2="1200" y2="600" stroke="#0f0c09" stroke-width="4"/>

      <!-- Window -->
      <g transform="translate(400, 120)">
        <rect x="-10" y="-10" width="420" height="270" fill="#15120f"/>
        <rect x="0" y="0" width="400" height="250" fill="#1e2530"/>
        <rect x="0" y="0" width="400" height="250" fill="url(#windowLight)"/>
        <line x1="200" y1="0" x2="200" y2="250" stroke="#15120f" stroke-width="6"/>
        <line x1="0" y1="125" x2="400" y2="125" stroke="#15120f" stroke-width="6"/>
        <path d="M20,230 Q100,210 180,230 T340,230" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
      </g>

      <!-- Sofa -->
      <g transform="translate(140, 480)">
        <ellipse cx="150" cy="110" rx="160" ry="50" fill="#3e3226"/>
        <rect x="20" y="60" width="260" height="80" rx="15" fill="#4a3b2e"/>
        <rect x="10" y="10" width="280" height="70" rx="12" fill="#524232"/>
        <rect x="0" y="40" width="30" height="90" rx="8" fill="#3e3226"/>
        <rect x="270" y="40" width="30" height="90" rx="8" fill="#3e3226"/>
      </g>

      <!-- Lamp -->
      <g transform="translate(900, 280)">
        <line x1="0" y1="-280" x2="0" y2="0" stroke="#1a1612" stroke-width="4"/>
        <path d="M-40,0 L40,0 L25,60 L-25,60 Z" fill="#2a2520"/>
        <ellipse cx="0" cy="60" rx="25" ry="8" fill="#ffcc80" fill-opacity="0.15"/>
        <circle cx="0" cy="60" r="140" fill="url(#lampGlow)" filter="url(#blurSoft)"/>
      </g>

      <!-- Bookshelf -->
      <g transform="translate(980, 180)">
        <rect x="0" y="0" width="160" height="340" fill="#2e231a"/>
        <rect x="10" y="10" width="140" height="80" fill="#1a120d"/>
        <rect x="10" y="100" width="140" height="80" fill="#1a120d"/>
        <rect x="10" y="190" width="140" height="80" fill="#1a120d"/>
        <rect x="15" y="20" width="20" height="60" fill="#5c4033"/>
        <rect x="45" y="25" width="15" height="55" fill="#4a5c33"/>
        <rect x="70" y="15" width="25" height="65" fill="#335c4a"/>
        <rect x="105" y="30" width="18" height="50" fill="#5c4a33"/>
      </g>

      <!-- Cobwebs in corners -->
      <path d="M0,0 Q80,40 120,0 T200,20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      <path d="M1200,0 Q1120,50 1080,0 T1000,30" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      <path d="M1200,600 Q1150,520 1200,480" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
    </svg>

    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
      <div id="top-bar">
        <div id="score-box">Score: <span id="score">0</span></div>
        <div id="combo-box">x<span id="combo">1</span></div>
        <div id="clean-box">Clean: <span id="clean">0</span>%</div>
      </div>
      <div id="health-bar"><div id="health-fill"></div></div>
      <div id="weapon-box">Vacuum Blaster</div>
    </div>

    <div id="overlay">
      <h1 id="title">SPYDER</h1>
      <p id="subtitle">Living Room Prototype</p>
      <button id="start-btn">Enter the House</button>
      <p id="controls">Move: ← → or A D · Shoot: Space or Click · Pause: P</p>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
